name: Market Pulse weekly delivery

# The Monday promise from the 2026-08-12 outreach: "your edition lands in
# your inbox as a PDF every Monday at 08:00 CET." Cron fires 05:45 UTC so
# generation and send comfortably beat 08:00 CET (06:00 UTC in summer,
# 07:00 in winter — early beats late for a newspaper).
#
# Idempotent by design: pulse_deliveries has UNIQUE (subscriber,
# edition_date), and the script skips already-delivered rows — a manual
# re-run after a red Monday fills gaps without double-sending.

#
# 2026-10-24: GitHub's scheduler has been starting this job 5-7h late (runs
# began 11:06-13:32 UTC on 09-21..10-19), and 10-19 failed on a one-off DNS
# error, so no edition went out that week. Fixes: two backstop crons on the
# same Monday fill any gap (the pulse_deliveries check makes them no-ops once
# sent), a concurrency group stops two runs overlapping, and the script
# retries DNS/connection-refused failures.
#
# Since 2026-10-24 this is the ONLY scheduled Market Pulse email: the daily
# same-day alerts (pulse-alerts.yml) are paused at the owner's request.

on:
  schedule:
    - cron: '45 5 * * 1'
    - cron: '15 8 * * 1'
    - cron: '15 12 * * 1'
  workflow_dispatch: {}

concurrency:
  group: pulse-weekly
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deliver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install reportlab
      - name: Generate and send editions
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python3 scripts/pulse/generate_editions.py
