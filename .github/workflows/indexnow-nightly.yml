name: IndexNow nightly ping

# Fires after the nightly data pipeline (feed 01:37, snapshots ~02:20) so the
# URLs we ping are already fresh. Deliberately a SEPARATE workflow — the
# nightly pipeline is a working system and stays untouched (the law).

on:
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/indexnow-ping.mjs
