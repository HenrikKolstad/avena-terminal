name: Portugal official statistics refresh

# Rebuilds data/pt-official.json (the /portugal market layer) from INE
# Portugal and Banco de Portugal BPstat. Both are keyless public APIs, so this
# job needs NO secrets. INE publishes the local price statistics quarterly and
# the licensing series monthly; a weekly pull is plenty and keeps the page
# within days of every INE release.
#
# If a source stops parsing, scripts/ingest-pt-official.ts exits non-zero and
# nothing is committed: the previous layer stays live and this run goes red.
# If nothing changed upstream the script leaves the file untouched and the
# commit step is a no-op.

on:
  schedule:
    - cron: '20 4 * * 2'   # Tuesdays 04:20 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pt-official-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Reachability probe (diagnostic only)
        continue-on-error: true
        run: |
          for u in https://www.ine.pt/ https://bpstat.bportugal.pt/data/v1/domains/39/; do
            curl -sS -o /dev/null -w "$u -> %{http_code} %{remote_ip} %{time_total}s\n" --max-time 60 "$u" || echo "$u -> curl failed"
          done

      - name: Build the Portugal layer from INE + Banco de Portugal
        run: npx tsx scripts/ingest-pt-official.ts

      - name: Commit refreshed layer (if changed)
        run: |
          git config user.name "avena-feed-bot"
          git config user.email "feed@avenaterminal.com"
          git add data/pt-official.json
          if git diff --staged --quiet; then
            echo "No Portugal layer changes this week."
          else
            git commit -m "chore(pt): weekly INE / Banco de Portugal refresh [skip ci]"
            git pull --rebase origin main
            git push
            echo "Pushed refreshed Portugal layer."
          fi
