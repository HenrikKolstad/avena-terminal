name: Spain rent benchmark refresh

# Rebuilds data/es-rents.json (the /spain/rents page) from the ministry
# SERPAVI workbook linked on the SERPAVI page and from INE IPVA table 59058.
# Both are keyless public sources, so this job needs NO secrets. SERPAVI is
# an annual tax-exploitation file and IPVA is an annual index; a weekly pull
# keeps the page within days of a release.
#
# Tuesday 04:35 UTC sits clear of the Monday 04:50 Eurostat job, the
# Wednesday 04:40 official-benchmark job, the Thursday 04:15 supply job and
# the Friday 04:25 municipal-appraisal job.
#
# If a required source stops parsing, scripts/ingest-es-rents.ts exits
# non-zero and nothing is committed: the previous layer stays live and this
# run goes red. If nothing changed upstream the script leaves the file
# untouched and the commit step is a no-op.

on:
  schedule:
    - cron: '35 4 * * 2'   # Tuesdays 04:35 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: es-rents-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Reachability probe (diagnostic only)
        continue-on-error: true
        run: |
          for u in \
            https://www.mivau.gob.es/vivienda/alquila-bien-es-tu-derecho/serpavi \
            https://servicios.ine.es/wstempus/js/ES/SERIES_TABLA/59058
          do
            curl -sS -L -o /dev/null -w "$u -> %{http_code} %{remote_ip} %{time_total}s\n" --max-time 60 -A 'Mozilla/5.0 (compatible; AvenaTerminal-OfficialStats/1.0; +https://avenaterminal.com/spain/rents)' "$u" || echo "$u -> curl failed"
          done

      - name: Build the Spain rent layer from SERPAVI + INE IPVA
        run: npx tsx scripts/ingest-es-rents.ts

      - name: Commit refreshed layer (if changed)
        run: |
          git config user.name "avena-feed-bot"
          git config user.email "feed@avenaterminal.com"
          git add data/es-rents.json
          if git diff --staged --quiet; then
            echo "No Spain rent layer changes this week."
          else
            git commit -m "chore(es): weekly SERPAVI / INE rent benchmark refresh [skip ci]"
            git pull --rebase origin main
            git push
            echo "Pushed refreshed Spain rent layer."
          fi
