name: Listing duration refresh

# Rebuilds data/listing-duration.json from price_snapshots and sold_properties.
# Coast, region and town only. The lender monitor is a different route and
# is not touched.
#
# 06:55 UTC is fifteen minutes after absorption-refresh.yml (06:40 UTC) and
# before the 07:00 capture backstop. Both jobs read the daily series. They
# stay separate so a failure in one does not skip the other. A day the
# capture backstop recovers later is picked up the next morning. The as-of
# date is the latest snapshot actually present, so a missed morning does
# not invent a day. If the read fails, the script exits non-zero and the
# previous file stays.

on:
  schedule:
    - cron: '55 6 * * *'   # 06:55 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listing-duration-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check the public aggregate before publishing
        run: npx tsx scripts/test-listing-duration.ts

      - name: Rebuild listing duration from the ledger
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/build-listing-duration.ts

      - name: Commit refreshed snapshot (if changed)
        run: |
          git config user.name "avena-feed-bot"
          git config user.email "feed@avenaterminal.com"
          git add data/listing-duration.json
          if git diff --staged --quiet; then
            echo "No listing-duration change this morning."
          else
            git commit -m "chore(data): refresh listing duration snapshot [skip ci]"
            git pull --rebase origin main
            git push
            echo "Pushed listing duration."
          fi
