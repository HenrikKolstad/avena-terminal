name: Nightly feed refresh

# Regenerates public/data.json from the RedSP feed every night on GitHub's
# servers — no local machine needed. Commits the refreshed data to main, which
# Vercel auto-deploys. This is what stops the deal feed from ever freezing.
#
# Runs before the Vercel score cron (02:00 UTC) so score_history is written
# from fresh prices. Also runnable on demand from the Actions tab.

on:
  schedule:
    - cron: '37 1 * * *'   # 01:37 UTC daily
  workflow_dispatch:
    inputs:
      gsc_backfill_days:
        description: 'Search Console days to backfill (rolling window; 7 = the last week)'
        required: false
        default: '7'

permissions:
  contents: write

concurrency:
  group: feed-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run the RedSP feed
        # Belt to parse-feed's own per-attempt timeout: 120min of wait budget
        # plus parse and upload should never approach this. If it does, the
        # step is wedged and the run must die loudly at a known hour rather
        # than sit on GitHub's silent 6h default holding the concurrency group.
        timeout-minutes: 150
        run: node parse-feed.js
        env:
          # Falls back to the hardcoded RedSP URL if the secret is unset.
          FEED_URL: ${{ secrets.FEED_URL }}
          # Optional: set these repo secrets to also write sold_properties +
          # price_snapshots to Supabase. Without them the script skips that step.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # ---------------------------------------------------------------------
      # Everything below parse-feed is ENRICHMENT. A day of feed history is
      # unbackfillable; an enrichment artifact can be rebuilt tomorrow. So no
      # enrichment step is allowed to stop the feed from being committed —
      # they run with continue-on-error and are re-raised by the final gate,
      # AFTER the feed is safely on main. (2026-08-08/09: the corpus step
      # exited 1 on missing Supabase secrets and took the whole nightly
      # refresh down with it, discarding two days of successfully parsed feed.)
      # ---------------------------------------------------------------------

      - name: Re-measure the AVM against the refreshed book
        # Accuracy figures quoted on the site come from here and nowhere else.
        # If the model drifts, model-stats.json drifts with it in the same commit.
        id: avm
        continue-on-error: true
        run: npx tsx scripts/avm-backtest.ts

      - name: Commit refreshed feed (if changed)
        # The irreplaceable step. Depends on parse-feed only.
        run: |
          git config user.name "avena-feed-bot"
          git config user.email "feed@avenaterminal.com"
          git add public/data.json public/model-stats.json public/feed-meta.json
          if git diff --staged --quiet; then
            echo "No feed changes today."
          else
            COUNT=$(node -e "console.log(require('./public/data.json').length)")
            git commit -m "chore(feed): nightly RedSP refresh — ${COUNT} listings [skip ci]"
            git pull --rebase origin main
            git push
            echo "Pushed refreshed feed (${COUNT} listings)."
          fi

      - name: Capture Search Console visibility
        # The measurement half of SEO. Search Console retains only 16 months,
        # so anything an experiment reads out against in 2028 must be captured
        # now. Enrichment: never allowed to block the feed commit.
        id: gsc
        continue-on-error: true
        # On a schedule `inputs` is empty, so this fallback — not the input
        # default above — is what runs every night. Both say 7 deliberately.
        run: npx tsx scripts/gsc-snapshot.ts --backfill ${{ inputs.gsc_backfill_days || '7' }}
        env:
          GOOGLE_SEARCH_CONSOLE_KEY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Regenerate open-data corpus artifacts
        # public/open-data/* — town aggregates, movement ledger, observed
        # moves, tombstones. Served on the site and declared as DataDownload
        # in the Dataset JSON-LD; regenerated here so the corpus surfaces can
        # never drift from the database. Refuses to run without Supabase
        # credentials rather than publishing an empty market history — that
        # refusal is correct, and the final gate turns the run red for it.
        id: corpus
        continue-on-error: true
        run: npx tsx scripts/build-open-dataset.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit corpus artifacts (if changed)
        if: steps.corpus.outcome == 'success'
        run: |
          git config user.name "avena-feed-bot"
          git config user.email "feed@avenaterminal.com"
          git add public/open-data
          if git diff --staged --quiet; then
            echo "No corpus changes today."
          else
            git commit -m "chore(corpus): nightly open-data rebuild [skip ci]"
            git pull --rebase origin main
            git push
            echo "Pushed corpus artifacts."
          fi

      - name: Capture price moves against the book we just published
        # The move-event ledger (property_pricing_history) is written only by
        # the pricing-history route, which reads the DEPLOYED data.json. Its
        # 02:20 UTC schedule is a guess at when this workflow lands — and the
        # guess has been wrong every night (commits observed 03:29–10:23), so
        # the route has only ever seen yesterday's book and has reported
        # moves_detected: 0 on every single run since it was fixed.
        #
        # So stop guessing: poll until the route reports the generation date
        # of the book we just pushed. That is a direct assertion that the
        # deploy landed AND the capture ran against it — not a sleep.
        id: capture
        continue-on-error: true
        run: |
          EXPECTED=$(node -e "console.log(require('./public/feed-meta.json').generated_date)")
          echo "Waiting for the deploy to serve the ${EXPECTED} book..."
          for i in $(seq 1 30); do
            BODY=$(curl -sS -m 60 -H 'x-vercel-cron: 1' \
              https://avenaterminal.com/api/cron/pricing-history || echo '{}')
            GOT=$(node -e "try{console.log(JSON.parse(process.argv[1]).feed_generated_date||'')}catch{console.log('')}" "$BODY")
            if [ "$GOT" = "$EXPECTED" ]; then
              echo "Captured against ${EXPECTED}: $BODY"
              node -e '
                const r = JSON.parse(process.argv[1]);
                if (r.errors) { console.error("Capture reported errors:", JSON.stringify(r.errors)); process.exit(1); }
                if (!r.snapshotted) { console.error("Capture wrote 0 snapshots on a live feed — that is a lost day."); process.exit(1); }
                // A quiet market is legitimate; a blind diff is not, and the
                // two are indistinguishable from price_moves alone. On
                // 2026-08-11 the run reported moves_detected: 0 across a day
                // holding 13 real reprices, because the diff had no baseline
                // to compare against. Assert the baseline exists, not that
                // moves were found.
                if (r.trusted_prior && !r.moves_baseline_refs) {
                  console.error("Capture had a trusted prior but 0 refs to diff against — the move ledger is blind, not quiet.");
                  process.exit(1);
                }
                console.log(`OK — snapshotted=${r.snapshotted} moves=${r.price_moves} baseline=${r.moves_baseline_refs} delisted=${r.delisted}`);
              ' "$BODY"
              exit $?
            fi
            echo "  attempt $i: route is serving '${GOT:-unknown}', want '${EXPECTED}' — waiting 30s"
            sleep 30
          done
          echo "Deploy never served the ${EXPECTED} book within 15 minutes."
          echo "Price moves and delistings for ${EXPECTED} were NOT captured."
          exit 1

      - name: Publish change answers from the observation ledger
        # Runs AFTER the capture step on purpose: it reads price_snapshots, so
        # running it first would publish yesterday's ledger as today's answer.
        #
        # These are the questions no other source in Spain can answer — the
        # portals publish current asking prices, not changes, and the official
        # series are quarterly and months in arrears. The script refuses to
        # publish when the evidence is below threshold rather than emitting a
        # confident zero, so a quiet market simply means nothing is written.
        id: answers
        continue-on-error: true
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/generate-change-answers.ts

      - name: Re-raise enrichment failures
        # The feed is committed by now, so failing here loses nothing but
        # still shows Henrik a red run. A silently-green enrichment failure
        # is the bug shape this whole repo keeps getting bitten by.
        if: steps.avm.outcome != 'success' || steps.corpus.outcome != 'success' || steps.gsc.outcome != 'success' || steps.capture.outcome != 'success' || steps.answers.outcome != 'success'
        run: |
          echo "avm-backtest: ${{ steps.avm.outcome }}"
          echo "open-dataset: ${{ steps.corpus.outcome }}"
          echo "gsc-snapshot: ${{ steps.gsc.outcome }}"
          echo "move-capture: ${{ steps.capture.outcome }}"
          echo "change-answers: ${{ steps.answers.outcome }}"
          echo "The feed itself was committed; the step(s) above still need fixing."
          exit 1
